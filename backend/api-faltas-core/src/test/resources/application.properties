# Recursos de test. Este archivo NO se empaqueta con la aplicacion.
#
# La configuracion base es fail-closed: application.yml no declara ninguna clave de firma
# del QR, de modo que sin una clave valida el contexto no arranca. Los tests que levantan
# el contexto de Spring necesitan una clave, y esa clave vive aca y solo aca.
#
# TEST_ONLY: literal sintetico, no es un secreto y no proviene del entorno local. No usar en
# ningun ambiente. La clave real de produccion se inyecta por FALTAS_QR_SECRET.
#
# Se usa un archivo .properties y no un .yml a proposito: Spring Boot carga
# application.properties y application.yml de la misma ubicacion, de modo que este archivo
# se suma a src/main/resources/application.yml en lugar de reemplazarlo, y el resto de la
# configuracion base sigue vigente en los tests.
faltas.qr.secret=TEST_ONLY-qr-signing-key-for-spring-context-0000
faltas.qr.payload-version-activa=0
